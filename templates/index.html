<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>MyBusiness Analytics</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
background:#f4f6f9;
}
.navbar{
background:#0d6efd;
}
.card{
border:none;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}
table{
background:white;
border-radius:15px;
overflow:hidden;
}
</style>

</head>
<body>

<nav class="navbar navbar-dark px-4">
<span class="navbar-brand mb-0 h1">📊 MyBusiness Analytics</span>

<div>
<a href="/" class="btn btn-light btn-sm">Accueil</a>
<a href="/add" class="btn btn-success btn-sm">Ajouter</a>
<a href="/dashboard" class="btn btn-warning btn-sm">Dashboard</a>
</div>
</nav>

<div class="container mt-4">

<div class="card p-4">

<h3 class="mb-4">📋 Liste des ventes</h3>

<table class="table table-striped">
<thead class="table-dark">
<tr>
<th>ID</th>
<th>Produit</th>
<th>Quantité</th>
<th>Prix</th>
<th>Client</th>
<th>Date</th>
<th>Action</th>
</tr>
</thead>

<tbody>
{% for sale in sales %}
<tr>
<td>{{ sale[0] }}</td>
<td>{{ sale[1] }}</td>
<td>{{ sale[2] }}</td>
<td>{{ sale[3] }}</td>
<td>{{ sale[4] }}</td>
<td>{{ sale[5] }}</td>
<td>
<a href="/delete/{{ sale[0] }}" class="btn btn-danger btn-sm">Supprimer</a>
</td>
</tr>
{% endfor %}
</tbody>

</table>

</div>

</div>

</body>
</html>
